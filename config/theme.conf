# ==============================================================================
# Webflow Sovereign TUI Theme Configuration (Yazi / Warm Sand Aesthetic)
# ==============================================================================
# Colors are mapped to ANSI 256-color palette indices or standard curses color names.
# To override this file, copy it to ~/.config/webflow/theme.conf

[palette]
# Main foreground & background (-1 = transparent/terminal default)
bg = -1
fg = 223

# Borders & structural dividers
border = 240
border_active = 214

# Titles & headers
header_fg = 214
header_bg = 236

# Warm sand/gold selection highlight bar
selected_fg = 235
selected_bg = 214

# Status pills at the bottom
pill_normal_fg = 235
pill_normal_bg = 214
pill_search_fg = 235
pill_search_bg = 108

# Tiers & Indicators
tier1 = 108
tier2 = 214
tier3 = 175
dim = 244
accent = 214

[layout]
# Column ratios (nav, middle, preview)
ratio_nav = 0.20
ratio_mid = 0.48
ratio_preview = 0.32

# Display relative line numbers in active list (Vim / Yazi style)
show_relative_numbers = true
